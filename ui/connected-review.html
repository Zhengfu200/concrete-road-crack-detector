<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>整体裂缝 · V2标注复核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f2;color:#202b26;font:15px/1.5 'Microsoft YaHei',sans-serif}header{background:#203d32;color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}small{color:#648071}header small{color:#c4d5cb}main{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:240px 1fr;gap:18px}aside,.panel{background:white;border:1px solid #dbe1da;border-radius:8px;padding:14px}aside{max-height:94vh;position:sticky;top:12px;overflow:auto}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #c5d3c8;border-radius:5px;background:#f6faf6;padding:7px 10px;margin:3px 2px}button:hover{background:#dfebe1}button.primary{background:#236546;color:white;border-color:#236546}button.warn{color:#944522}button:disabled{opacity:.5;cursor:default}input,textarea,select{max-width:100%;padding:6px;border:1px solid #c6d1c8;border-radius:4px}textarea{width:100%;min-height:60px}label{display:inline-block;margin:4px}#nav{list-style:none;padding:0}#nav button{width:100%;text-align:left;font-size:13px;margin:2px 0}#nav button.active{background:#e1eee4;border-color:#236546}.tag{font-size:12px;border-radius:3px;background:#eff2e9;padding:3px 6px}#message{padding:9px 14px;position:sticky;top:0;background:#fff5d8;z-index:2;white-space:pre-wrap;display:none}.pictures{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pictures h3{font-size:15px;margin:6px 0}.pictures canvas{width:100%;aspect-ratio:1;display:block;background:#222;touch-action:none}.controls{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.objects{max-height:230px;overflow:auto}.object{display:flex;gap:5px;border-bottom:1px solid #eee;padding:5px}.object input{width:18px}.object div{flex:1}.object.selected{background:#edf6ee}#ruleText{white-space:pre-wrap;font-size:13px;max-height:400px;overflow:auto}.actions{border-top:1px solid #ddd;margin-top:12px;padding-top:10px}#title{word-break:break-all;font-size:17px}#mode{color:#215c3c}details{margin-top:10px}a{color:#236546}.muted{color:#65736b;font-size:13px}.counts{font-variant-numeric:tabular-nums}.dirty{color:#a04b15}@media(max-width:1000px){main{grid-template-columns:180px 1fr}.controls{grid-template-columns:1fr}}@media(max-width:750px){main{display:block}aside{position:static;max-height:240px}.pictures{grid-template-columns:1fr}}
</style>
<header><div><h1>整体裂缝 · V2标注复核</h1><small>每个可见连通裂缝整体一个框，保留原始文件与每次修订</small></div><div id="phase"></div></header>
<div id="message" role="status"></div>
<main><aside><label>复核者姓名<input id="reviewer" placeholder="请输入你的姓名"></label><p class="muted">此处保存表示你亲自核对原图。AI建议尚未通过用户确认。</p><div id="counts" class="counts"></div><label>筛选<select id="filter"><option value="all">全部试标</option><option value="unconfirmed">未确认</option><option value="pending">待定</option><option value="confirmed">已确认</option></select></label><ul id="nav"></ul><button id="freeze" class="primary">确认试标并冻结规则</button><details><summary>查看完整标注规则</summary><div id="ruleText"></div></details></aside>
<section><div class="panel"><span id="category" class="tag"></span><h2 id="title"></h2><div class="muted" id="recordInfo"></div><div class="pictures"><div><h3>原图 / 原始分割多边形</h3><label><input type="checkbox" id="showPoly">显示原多边形及序号</label><canvas id="before" width="832" height="832"></canvas></div><div><h3>整体裂缝标注提案</h3><div id="mode">点击实例框可选中；修改后需保存</div><canvas id="after" width="832" height="832"></canvas></div></div>
<div class="controls"><div><b>实例与关联原多边形</b><div id="objects" class="objects"></div><button id="merge">合并勾选实例</button><button id="split">拆回各原多边形</button><button id="exclude" class="warn">排除勾选实例</button><button id="reset">恢复原多边形提案</button><div class="muted">只有原图可确认连通才合并；独立平行裂缝保持多个框。</div><details><summary>已排除的原多边形</summary><div id="excluded"></div><button id="restore">恢复全部排除项</button></details></div>
<div><b>补框与边界修正</b><p><button id="add">拖绘补充裂缝框</button><button id="adjust">拖绘替换所选框</button><button id="divide">拆分所选单个多边形</button><button id="cancel">取消拖绘</button></p><label>当前操作依据 / 所选实例依据<textarea id="objectReason" placeholder="例如：原图交点清晰，三条支路属于同一连通网络"></textarea></label><button id="applyReason">更新勾选实例依据</button><div class="muted">“拆分单个多边形”先删原框，再逐个拖绘独立实例，完成后点取消。拖绘可从右下向左上。</div></div></div>
<label style="display:block">整张判断依据 / 待定原因<textarea id="reason" placeholder="记录连接关系、补标或不确定点"></textarea></label><label><input type="checkbox" id="background">我已确认原图完全没有裂缝（仅空标注时需要）</label><div class="actions"><button id="prev">上一张</button><button id="draft">保存草稿</button><button id="pending" class="warn">保存为待定</button><button id="confirm" class="primary">确认本张并下一张</button><button id="next">下一张</button><span id="dirty"></span></div></div></section></main>
<script>
const TOKEN='__SESSION_TOKEN__', $=s=>document.querySelector(s), cats={segmented:'连续拆段',branched:'分叉交叉',independent:'独立多裂缝',faint:'细弱裂缝',edge_occlusion:'贴边 / 遮挡',full:'全量复核'};
let state,item,rec,img=new Image(),index=0,selected=new Set(),dirty=false,drawMode=null,start=null,splitSources=null,busy=false;
$('#reviewer').value=localStorage.getItem('connected-reviewer')||'';
function message(s){$('#message').textContent=s;$('#message').style.display=s?'block':'none'}
function changed(){dirty=true;$('#dirty').textContent='有未保存修改';$('#dirty').className='dirty'}
async function api(path,value){let options=value?{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':TOKEN},body:JSON.stringify(value)}:{};let r=await fetch(path,options);let v=await r.json();if(!r.ok)throw Error(v.error||'请求失败');return v}
function union(ids){let p=ids.flatMap(i=>item.polygons[i]);let xs=p.map(p=>p[0]),ys=p.map(p=>p[1]);let a=Math.min(...xs),b=Math.min(...ys),c=Math.max(...xs),d=Math.max(...ys);return [0,(a+c)/2,(b+d)/2,c-a,d-b]}
function baseObjects(){return item.polygons.map((p,i)=>({polygon_indices:[i],box:union([i]),reason:'原多边形，尚待判断连通关系'}))}
async function refresh(){state=await api('/api/state');$('#phase').textContent=state.frozen?'规则已冻结 · 全量复核':'第1阶段 · 50张试标';$('#ruleText').textContent=state.rules;$('#freeze').disabled=state.frozen;renderNav()}
function renderNav(){let n=state.items.filter(x=>x.status==='confirmed'&&x.reviewer_type==='human').length;$('#counts').textContent=`用户已确认 ${n} / ${state.items.length}；原数据 ${state.total_source} 张`;let nav=$('#nav');nav.replaceChildren();state.items.forEach((x,i)=>{let f=$('#filter').value;if(f==='unconfirmed'&&x.status==='confirmed'&&x.reviewer_type==='human'||f==='pending'&&x.status!=='pending'||f==='confirmed'&&!(x.status==='confirmed'&&x.reviewer_type==='human'))return;let b=document.createElement('button');b.className=i===index?'active':'';b.textContent=`${String(i+1).padStart(2,'0')} · ${x.id.split('.rf.')[0]} · ${x.status==='confirmed'?'已确认':x.status==='agent_reviewed'?'AI已复核':x.status==='pending'?'待定':x.reviewer_type==='agent'?'AI提案':'未确认'}`;b.onclick=()=>load(i);let li=document.createElement('li');li.append(b);nav.append(li)})}
async function load(i){if(busy)return;if(dirty&&!confirm('当前修改尚未保存，是否放弃并切换图片？'))return;index=(i+state.items.length)%state.items.length;busy=true;try{item=await api('/api/item?id='+encodeURIComponent(state.items[index].id));rec=structuredClone(item.record);selected.clear();drawMode=null;splitSources=null;$('#title').textContent=`${index+1}. ${item.id}`;$('#category').textContent=`${item.split} · ${cats[state.items[index].category]}`;$('#reason').value=rec.reason||'';$('#background').checked=!!rec.background_confirmed;$('#objectReason').value='';$('#recordInfo').textContent=`修订 ${rec.revision} · ${rec.reviewer_type==='agent'?'AI图像检查提案，尚待用户确认':rec.reviewer?'复核者 '+rec.reviewer:'尚未复核'}`;img=new Image();img.onload=render;img.src='/api/image?id='+encodeURIComponent(item.id);dirty=false;$('#dirty').textContent='';message('');renderNav()}catch(e){message(e.message)}finally{busy=false}}
function background(ctx){ctx.clearRect(0,0,832,832);ctx.drawImage(img,0,0,832,832)}
function drawBox(ctx,b,color,label,width=2){let x=(b[1]-b[3]/2)*832,y=(b[2]-b[4]/2)*832,w=b[3]*832,h=b[4]*832;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.strokeRect(x,y,w,h);ctx.font='bold 20px sans-serif';ctx.fillStyle=color;ctx.fillText(label,Math.max(2,x+2),Math.max(21,y+20))}
function paint(){if(!img.complete||!img.naturalWidth)return;let a=$('#before').getContext('2d'),b=$('#after').getContext('2d');background(a);background(b);if($('#showPoly').checked)item.polygons.forEach((ps,i)=>{a.beginPath();ps.forEach((p,j)=>j?a.lineTo(p[0]*832,p[1]*832):a.moveTo(p[0]*832,p[1]*832));a.closePath();a.strokeStyle='#00efdd';a.lineWidth=1.4;a.stroke();let p=ps[Math.floor(ps.length/2)];a.fillStyle='#0ff';a.font='bold 20px sans-serif';a.fillText('P'+i,p[0]*832,p[1]*832)});rec.objects.forEach((o,i)=>drawBox(b,o.box,selected.has(i)?'#ffe355':'#34ee96',String(i+1),selected.has(i)?4:2))}
function render(){paint();let list=$('#objects');list.replaceChildren();rec.objects.forEach((o,i)=>{let el=document.createElement('div');el.className='object'+(selected.has(i)?' selected':'');let c=document.createElement('input');c.type='checkbox';c.checked=selected.has(i);c.onchange=()=>{c.checked?selected.add(i):selected.delete(i);$('#objectReason').value=o.reason||'';render()};let text=document.createElement('div');text.textContent=`实例 ${i+1} ← ${o.polygon_indices.length?o.polygon_indices.map(x=>'P'+x).join(', '):'手动补框'} · ${o.reason||''}`;el.append(c,text);list.append(el)});$('#excluded').textContent=rec.excluded.map(e=>`P${e.polygon_index}: ${e.reason}`).join('；')||'无';$('#mode').textContent=drawMode?`拖绘模式：${drawMode==='add'?'补框':drawMode==='divide'?'拆分单个多边形，逐个拖绘':'替换所选框'}；完成后点取消`:'点击实例框可选中；修改后需保存'}
function reason(){let s=$('#objectReason').value.trim();if(!s)throw Error('请先填写当前操作依据');return s}
function action(fn){try{fn();changed();render();message('')}catch(e){message(e.message)}}
$('#merge').onclick=()=>action(()=>{if(selected.size<2)throw Error('至少勾选两个实例');let why=reason(),os=[...selected].map(i=>rec.objects[i]),ids=[...new Set(os.flatMap(o=>o.polygon_indices))];let corners=os.flatMap(o=>{let b=o.box;return [[b[1]-b[3]/2,b[2]-b[4]/2],[b[1]+b[3]/2,b[2]+b[4]/2]]});let xs=corners.map(p=>p[0]),ys=corners.map(p=>p[1]);let l=Math.min(...xs),r=Math.max(...xs),t=Math.min(...ys),d=Math.max(...ys);rec.objects=rec.objects.filter((o,i)=>!selected.has(i));rec.objects.push({polygon_indices:ids,box:[0,(l+r)/2,(t+d)/2,r-l,d-t],reason:why});selected=new Set([rec.objects.length-1])});
$('#split').onclick=()=>action(()=>{if(!selected.size)throw Error('请勾选实例');let why=reason(),ids=[...new Set([...selected].flatMap(i=>rec.objects[i].polygon_indices))];if(!ids.length)throw Error('手动框没有原多边形，请手动重绘');rec.objects=rec.objects.filter((o,i)=>!selected.has(i));ids.forEach(i=>rec.objects.push({polygon_indices:[i],box:union([i]),reason:why}));selected.clear()});
$('#exclude').onclick=()=>action(()=>{if(!selected.size)throw Error('请勾选实例');let why=reason(),ids=[...new Set([...selected].flatMap(i=>rec.objects[i].polygon_indices))];rec.objects=rec.objects.filter((o,i)=>!selected.has(i));ids.filter(i=>!rec.objects.some(o=>o.polygon_indices.includes(i))).forEach(i=>rec.excluded.push({polygon_index:i,reason:why}));selected.clear()});
$('#restore').onclick=()=>action(()=>{rec.excluded.forEach(e=>rec.objects.push({polygon_indices:[e.polygon_index],box:union([e.polygon_index]),reason:'恢复原多边形，需重新判断'}));rec.excluded=[]});
$('#reset').onclick=()=>{if(confirm('恢复本图原始多边形对应框？已保存历史仍保留。'))action(()=>{rec.objects=baseObjects();rec.excluded=[];selected.clear()})};
$('#applyReason').onclick=()=>action(()=>{if(!selected.size)throw Error('请勾选实例');let why=reason();selected.forEach(i=>{rec.objects[i].reason=why;if(rec.objects[i].split_reason)rec.objects[i].split_reason=why})});
$('#add').onclick=()=>{drawMode='add';splitSources=null;render()};$('#adjust').onclick=()=>{if(selected.size!==1)return message('替换边界需要只勾选一个实例');drawMode='adjust';render()};
$('#divide').onclick=()=>action(()=>{if(selected.size!==1)throw Error('请只勾选一个含原多边形的实例');let i=[...selected][0],o=rec.objects[i];if(o.polygon_indices.length!==1)throw Error('请先拆回各原多边形，再拆分其中一个');reason();splitSources=[...o.polygon_indices];rec.objects.splice(i,1);selected.clear();drawMode='divide'});
$('#cancel').onclick=()=>{drawMode=null;splitSources=null;render()};
function pos(e){let r=$('#after').getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
$('#after').onpointerdown=e=>{let p=pos(e);if(drawMode){start=p;$('#after').setPointerCapture(e.pointerId)}else{let hits=rec.objects.map((o,i)=>({o,i})).filter(({o})=>Math.abs(p[0]-o.box[1])<=o.box[3]/2&&Math.abs(p[1]-o.box[2])<=o.box[4]/2).sort((a,b)=>a.o.box[3]*a.o.box[4]-b.o.box[3]*b.o.box[4]);if(hits.length){let i=hits[0].i;selected.has(i)?selected.delete(i):selected.add(i);$('#objectReason').value=rec.objects[i].reason||'';render()}}};
$('#after').onpointermove=e=>{if(!start)return;paint();let p=pos(e);drawBox($('#after').getContext('2d'),[0,(p[0]+start[0])/2,(p[1]+start[1])/2,Math.abs(p[0]-start[0]),Math.abs(p[1]-start[1])],'#ffe355','新框',3)};
$('#after').onpointerup=e=>{if(!start)return;let p=pos(e),box=[0,(p[0]+start[0])/2,(p[1]+start[1])/2,Math.abs(p[0]-start[0]),Math.abs(p[1]-start[1])];start=null;action(()=>{if(box[3]*832<2||box[4]*832<2)throw Error('框太小，请重绘');let why=reason();if(drawMode==='adjust'){if(selected.size!==1)throw Error('请选择一个实例');let i=[...selected][0];rec.objects[i].box=box;rec.objects[i].reason=why;drawMode=null}else{rec.objects.push({polygon_indices:splitSources||[],box,reason:why,...(splitSources?{split_reason:why}:{})});selected=new Set([rec.objects.length-1]);if(drawMode!=='divide')drawMode=null}})};
async function save(status){if(busy)return;busy=true;try{let reviewer=$('#reviewer').value.trim();if(!reviewer)throw Error('请在左侧填写你的姓名');rec.reason=$('#reason').value;rec.background_confirmed=$('#background').checked;let value={...rec,status,expected_revision:rec.revision};rec=await api('/api/save',{id:item.id,reviewer,annotation:value});localStorage.setItem('connected-reviewer',reviewer);dirty=false;$('#dirty').textContent='已保存';await refresh();message(status==='confirmed'?'已记录本张用户确认':'已保存'+(status==='pending'?'为待定':'草稿'));busy=false;if(status==='confirmed'&&index<state.items.length-1)await load(index+1);else render()}catch(e){message(e.message)}finally{busy=false}}
$('#draft').onclick=()=>save('draft');$('#pending').onclick=()=>save('pending');$('#confirm').onclick=()=>save('confirmed');$('#prev').onclick=()=>load(index-1);$('#next').onclick=()=>load(index+1);$('#showPoly').onchange=paint;$('#filter').onchange=renderNav;$('#reason').oninput=changed;$('#background').onchange=changed;
$('#freeze').onclick=async()=>{try{if(dirty)throw Error('请先保存当前图');if(!confirm('确认50张试标已逐张核对，按当前整体连通裂缝规则继续全量复核？'))return;await api('/api/freeze',{reviewer:$('#reviewer').value});await refresh();message('规则已冻结，已开放全部图片。完成全量复核后才可导出V2。')}catch(e){message(e.message)}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
(async()=>{try{await refresh();await load(0)}catch(e){message(e.message)}})();
</script></html>
